<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Écriture — Journal de l'école</title>
    <link rel="stylesheet" href="css/acceuil.css">
  </head>
  <body>
    <header class="masthead">
      <p class="kicker">Espace rédacteur</p>
      <h1 id="titre">Écriture</h1>
      <p class="rule" id="qui">Le nom s'affichera ici.</p>
    </header>

    <main>
      <form id="ecriture">
        <label>
          Titre
          <input name="titre" type="text" maxlength="120" required>
        </label>
        <label>
          Sous-titre
          <input name="sous-titre" type="text" maxlength="120">
        </label>
        <label>
          Texte
          <textarea name="corps" rows="12" maxlength="100000"></textarea>
        </label>
        <button type="button">Garder</button>
        <p id="message-ecriture" class="note" role="status"></p>
      </form>

      <p class="liens">
        <a href="documents.html">Mes documents</a>
        <a href="index.html">Accueil</a>
      </p>
    </main>

    <footer>
      <p>Page ouverte sur cet ordinateur. AWS n'est pas contacté.</p>
    </footer>
      <script type="module" src="js/editeur.js"></script>
  </body>
</html>
